<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M-WORM флешер</title>
<style>
:root{--bg:#f4f4f2;--fg:#1b1b1b;--mut:#6b6b66;--card:#fff;--bd:#d6d6d0;--ac:#2a6df4;--ok:#1a8a3c;--er:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#e8e8e4;--mut:#8f8f88;--card:#1f1f1e;--bd:#35352f;--ac:#6b9dff;--ok:#4cc26f;--er:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.45;cursor:default}
input[type=text]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);width:150px}
#drop{border:2px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}
#drop.on{border-color:var(--ac);color:var(--fg)}
#bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:12px}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#log{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:260px;overflow:auto;margin:0}
.ok{color:var(--ok)}.er{color:var(--er)}.mut{color:var(--mut)}
label{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
<h1>M-WORM флешер</h1>
<p class="sub">Прошивает .fwsc на M-VAVE FM-1 по USB-MIDI.</p>

<div class="card">
  <div id="drop">Перетащи сюда <b>m-worm.fwsc</b> или нажми для выбора</div>
  <input id="file" type="file" accept=".fwsc" hidden>
  <div id="pkg" class="mut" style="margin-top:10px"></div>
</div>

<div class="card">
  <div class="row">
    <button id="bInfo">Найти FM-1</button>
    <button id="bFlash" class="pri" disabled>Прошить</button>
    <label>порт: <input id="port" type="text" placeholder="часть имени"></label>
  </div>
  <div id="dev" class="mut" style="margin-top:10px">Устройство не проверено.</div>
  <div id="bar"><i></i></div>
  <div id="stage" class="mut" style="margin-top:6px"></div>
</div>

<div class="card"><pre id="log"></pre></div>
<p class="mut" style="font-size:13px">Нужен Chrome или Edge, data-кабель напрямую в порт (без хаба), закрытые DAW и M-Upgrade. Во время записи не отключай FM-1 и не закрывай вкладку.</p>
</main>

<script>
/* ============ протокол (порт mworm_flash.py) ============ */
const HS_QUERY = [0xF0,0x00,0x32,0x45,0x00,0x00,0x00,0x40,0x7F,0xF7];
const UPGRADE  = [0xF0,0x22,0x24,0x35,0x7F,0xF7];
const FINISH_CHECK = 0xE0000000, FINISH_WRITE = 0xF0000000;
const BLOCKS = 20, BLK = 0x30, KEEP = 0x2F, MAXDATA = 512;
const LOADER_MARK = "FELUCCA-LOADER-1";
const PORT_RE = /fm-1|felucca|hortator|mnm|ota|composite|sinco|usb-midi/i;
const DELAY = {open:300,start:2000,reply:10,loader:3000,reboot:3000,retry:1000,poll:1000,hs:1000,
  idle_check:8000,idle_write:180000,wait_loader:30000,wait_reboot:40000};
const sleep = ms => new Promise(r => setTimeout(r, ms));

function pack7(data){const out=[];let acc=0,nb=0;
  for(const b of data){acc|=(b&0xFF)<<nb;nb+=8;while(nb>=7){out.push(acc&0x7F);acc>>>=7;nb-=7;}}
  if(nb)out.push(acc&0x7F);return out;}
function unpack7(data){const out=[];let acc=0,nb=0;
  for(const b of data){acc|=(b&0x7F)<<nb;nb+=7;while(nb>=8){out.push(acc&0xFF);acc>>>=8;nb-=8;}}
  return out;}

function productOf(raw){
  if(raw.length<BLOCKS*BLK)return null;let s="";
  for(let i=0;i<BLOCKS;i++){const b=raw[i*BLK+KEEP];if(b!==0x7D)s+=String.fromCharCode((b-i-1)&0xFF);}
  return s;}
function logicalImage(raw){
  const parts=[];for(let i=0;i<BLOCKS;i++)parts.push(raw.subarray(i*BLK,i*BLK+KEEP));
  parts.push(raw.subarray(BLOCKS*BLK));
  let n=0;for(const p of parts)n+=p.length;const out=new Uint8Array(n);let o=0;
  for(const p of parts){out.set(p,o);o+=p.length;}return out;}
function hasMark(raw){const m=[...LOADER_MARK].map(c=>c.charCodeAt(0));
  outer:for(let i=0;i+m.length<=raw.length;i++){for(let j=0;j<m.length;j++)if(raw[i+j]!==m[j])continue outer;return true;}
  return false;}

function response(addr,data,fl=0){
  const n=data.length,body=[0x00,0x59,0x30,(n+8)&0xFF,((n+8)>>8)&0xFF,0,fl,
    addr&0xFF,(addr>>>8)&0xFF,(addr>>>16)&0xFF,(addr>>>24)&0xFF,n&0xFF,(n>>8)&0xFF,0,...data];
  let sum=0;for(let i=6;i<body.length;i++)sum+=body[i];body.push(~sum&0xFF);
  return Uint8Array.from([0xF0,...pack7(body),0xF7]);}
function parseRequest(pkt){
  if(pkt.length<2||pkt[0]!==0xF0||pkt[pkt.length-1]!==0xF7)return null;
  const u=unpack7(pkt.slice(1,-1));
  if(u.length!==15||u[0]!==0||u[1]!==0x59||u[2]!==0x30)return null;
  let s=0;for(let i=6;i<14;i++)s+=u[i];if((~s&0xFF)!==u[14])return null;
  return {fl:u[6],addr:(u[7]|u[8]<<8|u[9]<<16|u[10]<<24)>>>0,n:u[11]|u[12]<<8|u[13]<<16};}
function parseIdentity(pkt){
  if(pkt.length<2||pkt[0]!==0xF0||pkt[pkt.length-1]!==0xF7)return null;
  const d=unpack7(pkt.slice(1,-1));
  if(d.length!==34||d[0]!==0||d[1]!==0x59||d[2]!==0x11)return null;
  let t=d.slice(6,33);while(t.length&&t[t.length-1]===0)t.pop();
  const text=String.fromCharCode(...t),m=/^([^_]+)_(\d+)$/.exec(text);
  return m?{text,model:m[1],version:+m[2],loader:m[1].toLowerCase().startsWith("ota-")}:null;}
const modelOf=t=>t.split("_")[0].replace(/^ota-/i,"");

/* ============ MIDI ============ */
let access=null;
class Link{
  constructor(inp,out){this.inp=inp;this.out=out;this.q=[];this.w=null;this.buf=null;
    inp.onmidimessage=e=>this.rx(e.data);}
  static async open(inp,out){await inp.open();await out.open();const l=new Link(inp,out);await sleep(DELAY.open);return l;}
  rx(d){
    if(d[0]===0xF0)this.buf=[];else if(!this.buf)return;
    for(const b of d)this.buf.push(b);
    if(d[d.length-1]===0xF7){const p=Uint8Array.from(this.buf);this.buf=null;
      if(this.w){const w=this.w;this.w=null;w(p);}else this.q.push(p);}}
  get lost(){return ![...access.inputs.values()].some(i=>i.id===this.inp.id&&i.state==="connected");}
  send(pkt){try{this.out.send(pkt);return true;}catch(e){return false;}}
  read(ms){if(this.q.length)return Promise.resolve(this.q.shift());
    return new Promise(res=>{const t=setTimeout(()=>{this.w=null;res(null);},Math.max(ms,0));
      this.w=p=>{clearTimeout(t);res(p);};});}
  drain(){this.q.length=0;}
  async close(){this.inp.onmidimessage=null;try{await this.inp.close();}catch(e){}try{await this.out.close();}catch(e){}}
}
const baseName=n=>n.replace(/\s+\d+$/,"");
function pairOutput(inp){
  const outs=[...access.outputs.values()].filter(o=>o.state==="connected");
  let o=outs.find(x=>x.name===inp.name);if(o)return o;
  const same=outs.filter(x=>baseName(x.name)===baseName(inp.name));
  if(same.length===1)return same[0];
  return outs.length===1?outs[0]:null;}

async function handshake(link,tries=3){
  link.drain();
  for(let t=0;t<tries;t++){
    if(!link.send(Uint8Array.from(HS_QUERY)))return null;
    const end=performance.now()+DELAY.hs;
    while(performance.now()<end){const p=await link.read(end-performance.now());if(!p)break;
      const id=parseIdentity(p);if(id)return id;}}
  return null;}

/* ============ updater ============ */
class Updater{
  constructor(port,ui){this.port=(port||"").toLowerCase();this.ui=ui;}
  candidates(){const ins=[...access.inputs.values()].filter(i=>i.state==="connected");
    return this.port?ins.filter(i=>i.name.toLowerCase().includes(this.port)):ins.filter(i=>PORT_RE.test(i.name));}
  async find(want){
    for(const inp of this.candidates()){
      const out=pairOutput(inp);if(!out)continue;
      let link;try{link=await Link.open(inp,out);}catch(e){this.ui.log(`  порт ${inp.name}: не открыть (${e.message||e})`,"mut");continue;}
      const id=await handshake(link,2);
      if(id&&(!want||want(id)))return {link,id,name:inp.name};
      await link.close();}
    return null;}
  async waitFor(want,ms){const end=performance.now()+ms;
    while(performance.now()<end){const d=await this.find(want);if(d)return d;await sleep(DELAY.retry);}return null;}
  async serve(link,image,finish,idle,progress){
    let served=0,last=performance.now();
    for(;;){
      const pkt=await link.read(DELAY.poll);
      if(!pkt){if(link.lost)return {served,finished:false,lost:true};
        if(performance.now()-last>idle)return {served,finished:false,lost:false};continue;}
      const r=parseRequest(pkt);if(!r)continue;
      const {fl,addr,n}=r;last=performance.now();
      if(addr===FINISH_CHECK||addr===FINISH_WRITE){
        link.send(response(addr,[...new TextEncoder().encode("success"),0]));
        if(addr===finish)return {served,finished:true,lost:false};continue;}
      if(n>MAXDATA||addr+n>image.length){this.ui.log(`  ошибка: запрос ${addr.toString(16)}+${n} за границей пакета`,"er");
        return {served,finished:false,lost:false};}
      await sleep(DELAY.reply);
      if(!link.send(response(addr,image.subarray(addr,addr+n),fl)))return {served,finished:false,lost:true};
      served++;progress(served,addr+n);}}
  async check(dev,image){
    const ui=this.ui;ui.stage(`запуск обновления на ${dev.id.text}`);
    dev.link.send(Uint8Array.from(UPGRADE));await sleep(DELAY.start);
    const r=await this.serve(dev.link,image,FINISH_CHECK,DELAY.idle_check,k=>ui.stage(`проверка пакета (${k} чтений)`));
    await dev.link.close();
    if(!r.finished)throw new Error("FM-1 перестал отвечать до запуска загрузчика. Переподключи USB и повтори.");
    ui.stage("переключение в режим обновления");await sleep(DELAY.loader);
    const ota=await this.waitFor(i=>i.loader,DELAY.wait_loader);
    if(!ota)throw new Error("OTA-загрузчик не появился. Переподключи USB и повтори (устройство останется в режиме обновления).");
    return ota;}
  async write(ota,image){
    const ui=this.ui,total=image.length;ui.prog(0);ota.link.send(Uint8Array.from(UPGRADE));await sleep(DELAY.start);
    const r=await this.serve(ota.link,image,FINISH_WRITE,DELAY.idle_write,(k,e)=>{const p=Math.min(99,Math.floor(e*100/total));ui.prog(p);ui.stage(`запись ${p}%`);});
    await ota.link.close();
    if(!r.finished)throw new Error("загрузчик перестал отвечать. Переподключи USB и повтори — запись продолжится.");
    ui.prog(100);ui.stage("запись 100%");}
  async verify(product){
    const ui=this.ui;ui.stage("перезагрузка");await sleep(DELAY.reboot);
    const back=await this.waitFor(i=>!i.loader,DELAY.wait_reboot);
    if(!back)throw new Error("FM-1 не вернулся после перезагрузки — выключи и включи питание.");
    await back.link.close();
    if(back.id.text!==product)ui.log(`записано, но FM-1 сообщает ${back.id.text} (ожидалось ${product}). Перезагрузи питание.`,"er");
    else{ui.log(`готово: FM-1 работает на ${back.id.text}`,"ok");ui.stage("готово");}}
  async install(dev,image,product){
    if(modelOf(dev.id.text)!==modelOf(product)){await dev.link.close();throw new Error(`устройство — ${dev.id.text}, а пакет для ${product}`);}
    const ota=dev.id.loader?dev:await this.check(dev,image);
    await this.write(ota,image);await this.verify(product);}
}

/* ============ UI ============ */
if(typeof document!=="undefined"){
const $=id=>document.getElementById(id);
const ui={
  log(s,c){const l=$("log"),e=document.createElement("span");if(c)e.className=c;e.textContent=s+"\n";l.appendChild(e);l.scrollTop=l.scrollHeight;},
  stage(s){$("stage").textContent=s;},
  prog(p){$("bar").firstElementChild.style.width=p+"%";}};
let raw=null,product=null,busy=false;
const setBusy=b=>{busy=b;$("bInfo").disabled=b;$("bFlash").disabled=b||!product;};
window.addEventListener("beforeunload",e=>{if(busy){e.preventDefault();e.returnValue="";}});

async function ensureMidi(){
  if(access)return true;
  if(!navigator.requestMIDIAccess){ui.log("Web MIDI недоступен: открой страницу в Chrome или Edge.","er");return false;}
  try{access=await navigator.requestMIDIAccess({sysex:true});}
  catch(e){ui.log("Нет доступа к MIDI (нужно разрешить SysEx): "+(e.message||e),"er");return false;}
  access.onstatechange=()=>{};return true;}

async function loadFile(f){
  raw=new Uint8Array(await f.arrayBuffer());product=productOf(raw);
  if(!product||!/^[^_]+_\d+$/.test(product)){raw=null;product=null;
    $("pkg").textContent="";ui.log(`${f.name}: не FM-1 пакет (identity ${JSON.stringify(product)})`,"er");setBusy(busy);return;}
  $("pkg").innerHTML="";$("pkg").append(`пакет: ${f.name} · ${product} · ${raw.length} байт`);
  if(!hasMark(raw))ui.log(`внимание: в пакете нет загрузчика Felucca (identity ${product})`,"er");
  setBusy(busy);}
const drop=$("drop");
drop.onclick=()=>$("file").click();
$("file").onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add("on");};
drop.ondragleave=()=>drop.classList.remove("on");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("on");e.dataTransfer.files[0]&&loadFile(e.dataTransfer.files[0]);};

async function findDevice(){
  if(!await ensureMidi())return null;
  ui.log("поиск FM-1…","mut");
  const up=new Updater($("port").value,ui),dev=await up.find();
  if(!dev){const n=[...access.inputs.values()].map(i=>i.name);
    $("dev").textContent="FM-1 не найден.";
    ui.log("FM-1 не найден. MIDI-входы: "+(n.length?n.join(", "):"(нет)"),"er");return null;}
  $("dev").textContent=`${dev.id.text} · ${dev.name}`+(dev.id.loader?" · режим обновления (допишу запись)":"");
  ui.log(`устройство: ${dev.id.text} (${dev.name})`+(dev.id.loader?" [режим обновления]":""),"ok");
  return {up,dev};}

$("bInfo").onclick=async()=>{setBusy(true);try{const r=await findDevice();if(r)await r.dev.link.close();}
  catch(e){ui.log("ошибка: "+(e.message||e),"er");}setBusy(false);};

$("bFlash").onclick=async()=>{
  if(!raw)return;setBusy(true);ui.prog(0);ui.stage("");
  try{
    const r=await findDevice();if(!r){setBusy(false);return;}
    if(!hasMark(raw)&&!confirm("В пакете нет загрузчика Felucca. Всё равно прошить?")){await r.dev.link.close();setBusy(false);return;}
    if(!confirm(`Прошить ${product} на ${r.dev.id.text}?\nНе отключай FM-1 во время записи.`)){await r.dev.link.close();setBusy(false);return;}
    ui.log(`пакет: ${product} (${raw.length} байт)`);
    await r.up.install(r.dev,logicalImage(raw),product);
  }catch(e){ui.log("ошибка: "+(e.message||e),"er");}
  setBusy(false);};
}
</script>
</body>
</html>
